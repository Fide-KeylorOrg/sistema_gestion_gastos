services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos
      POSTGRES_DB: gastos
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos -d gastos"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The "app" profile runs the production image (same as AWS); `make dev` only needs db.
  migrate:
    profiles: [app]
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://gastos:gastos@db:5432/gastos
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: [app]
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://gastos:gastos@db:5432/gastos
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
